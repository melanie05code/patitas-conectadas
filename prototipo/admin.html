<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Administración — Patitas Conectadas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container">
    <h1>Panel de Administración</h1>
    <p class="subtitle">Gestión de solicitudes y mascotas del refugio</p>

    <div class="card">
      <h2>Solicitudes pendientes</h2>
      <div id="pendingList"></div>
    </div>

    <div class="card">
      <div class="row-flex">
        <h2 style="margin-bottom:0;">Gestión de mascotas</h2>
        <button onclick="document.getElementById('newPetForm').style.display='block'; this.style.display='none';">+ Agregar mascota</button>
      </div>
      <form id="newPetForm" style="display:none; margin-top:14px; border-top:1px solid #eee; padding-top:14px;">
        <label>Nombre</label>
        <input type="text" id="np_name" required>
        <label>Tipo</label>
        <select id="np_type"><option>Perro</option><option>Gato</option></select>
        <label>Edad</label>
        <input type="text" id="np_age" required placeholder="Ej. 1 año">
        <label>Raza</label>
        <input type="text" id="np_breed" required>
        <label>Sexo</label>
        <select id="np_sex"><option>Macho</option><option>Hembra</option></select>
        <label>Descripción</label>
        <textarea id="np_desc" required></textarea>
        <button type="submit" class="full">Guardar mascota</button>
      </form>
      <div id="petList" style="margin-top:14px;"></div>
    </div>
  </div>
    <footer class="site-footer-mini">📍 Managua, Nicaragua &nbsp;·&nbsp; 📞 +505 8888-0000 &nbsp;·&nbsp; ✉ contacto@patitasconectadas.com<br><span style="opacity:0.7;">Patitas Conectadas — Proyecto Integrador UCN 2026</span></footer>
  <script src="js/app.js"></script>
  <script>
    requireAuth("admin");
    renderTopbar("admin");

    function renderPending() {
      const requests = db.getRequests().filter(r => r.status === "En revisión");
      const pets = db.getPets();
      const users = db.getUsers();
      const el = document.getElementById("pendingList");
      if (requests.length === 0) {
        el.innerHTML = '<div class="empty-state">No hay solicitudes pendientes.</div>';
        return;
      }
      el.innerHTML = requests.map(r => {
        const pet = pets.find(p => p.id === r.petId);
        const user = users.find(u => u.id === r.userId);
        return `
          <div class="row-flex" style="padding:12px 0; border-bottom:1px solid #eee;">
            <div class="avatar">${petIcon(pet ? pet.type : "")}</div>
            <div style="flex:1;">
              <div style="font-weight:bold;">${pet ? pet.name : "Mascota"}</div>
              <div style="color:var(--gray); font-size:0.85rem;">Solicitante: ${user ? user.name : "Desconocido"}</div>
            </div>
            <button onclick="resolveRequest(${r.id}, 'Aprobada')" style="background:var(--green);">✔ Aprobar</button>
            <button onclick="resolveRequest(${r.id}, 'Rechazada')" class="danger">✕ Rechazar</button>
          </div>
        `;
      }).join("");
    }

    function resolveRequest(id, newStatus) {
      const requests = db.getRequests();
      const req = requests.find(r => r.id === id);
      if (!req) return;
      req.status = newStatus;
      db.saveRequests(requests);

      // Actualizar estado de la mascota
      const pets = db.getPets();
      const pet = pets.find(p => p.id === req.petId);
      if (pet) pet.status = newStatus === "Aprobada" ? "Adoptada" : "Disponible";
      db.savePets(pets);

      // Crear notificación
      const notifs = db.getNotifications();
      notifs.push({
        id: Date.now(),
        userId: req.userId,
        text: newStatus === "Aprobada"
          ? `¡Tu solicitud para ${pet ? pet.name : "la mascota"} fue aprobada!`
          : `Tu solicitud para ${pet ? pet.name : "la mascota"} fue rechazada.`,
        date: "Hace un momento",
      });
      db.saveNotifications(notifs);

      renderPending();
      renderPetList();
    }

    function renderPetList() {
      const pets = db.getPets();
      const el = document.getElementById("petList");
      el.innerHTML = `
        <table>
          <tr><th>Mascota</th><th>Tipo</th><th>Estado</th></tr>
          ${pets.map(p => {
            const badgeClass = p.status === "Disponible" ? "green" : p.status === "Adoptada" ? "gray" : "orange";
            return `<tr><td>${p.name}</td><td>${p.type}</td><td><span class="badge ${badgeClass}">${p.status}</span></td></tr>`;
          }).join("")}
        </table>
      `;
    }

    document.getElementById("newPetForm").addEventListener("submit", function(e){
      e.preventDefault();
      const pets = db.getPets();
      pets.push({
        id: Date.now(),
        name: document.getElementById("np_name").value,
        type: document.getElementById("np_type").value,
        age: document.getElementById("np_age").value,
        breed: document.getElementById("np_breed").value,
        sex: document.getElementById("np_sex").value,
        desc: document.getElementById("np_desc").value,
        status: "Disponible",
      });
      db.savePets(pets);
      this.reset();
      this.style.display = "none";
      renderPetList();
    });

    renderPending();
    renderPetList();
  </script>
</body>
</html>
