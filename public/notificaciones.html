<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Notificaciones — Patitas Conectadas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container">
    <h1>Notificaciones</h1>
    <p class="subtitle">Novedades sobre tus solicitudes</p>
    <div id="list"></div>
  </div>
    <footer class="site-footer-mini">📍 Managua, Nicaragua &nbsp;·&nbsp; 📞 +505 8888-0000 &nbsp;·&nbsp; ✉ contacto@patitasconectadas.com<br><span style="opacity:0.7;">Patitas Conectadas — Proyecto Integrador UCN 2026</span></footer>
  <script src="js/app.js"></script>
  <script>
    const s = requireAuth();
    renderTopbar("notificaciones");

    const myNotifs = db.getNotifications().filter(n => n.userId === s.id).sort((a,b) => b.id - a.id);
    const list = document.getElementById("list");

    if (myNotifs.length === 0) {
      list.innerHTML = '<div class="empty-state">No tienes notificaciones todavía.</div>';
    } else {
      list.innerHTML = myNotifs.map(n => `
        <div class="notif card">
          <div class="avatar">🔔</div>
          <div>
            <div>${escaparHtml(n.text)}</div>
            <small>${escaparHtml(n.date)}</small>
          </div>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
