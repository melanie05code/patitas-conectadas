<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta — Patitas Conectadas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container narrow">
    <div class="card">
      <div class="logo-block">
        <div class="paw"><svg class="icono" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="7" cy="8" r="2"/><circle cx="12" cy="5.5" r="2"/><circle cx="17" cy="8" r="2"/><circle cx="19" cy="13" r="1.8"/><circle cx="5" cy="13" r="1.8"/><path d="M12 11c-3 0-5.5 4-5.5 6.2 0 1.6 1.3 2.3 2.7 2.3 1.2 0 1.8-.6 2.8-.6s1.6.6 2.8.6c1.4 0 2.7-.7 2.7-2.3C17.5 15 15 11 12 11z"/></svg></div>
        <h1>Crear cuenta</h1>
        <p class="subtitle">Únete y empieza a buscar a tu mascota ideal</p>
      </div>
      <div id="alertBox"></div>
      <form id="regForm">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" required placeholder="Tu nombre">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required placeholder="tu@correo.com">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="Mínimo 8 caracteres" minlength="8">
        <label for="password2">Confirmar contraseña</label>
        <input type="password" id="password2" required minlength="8">
        <button type="submit" class="full">Crear cuenta</button>
      </form>
      <p class="link-line">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </div>
    <footer class="site-footer-mini">Managua, Nicaragua &nbsp;·&nbsp; Tel. +505 8888-0000 &nbsp;·&nbsp; contacto@patitasconectadas.com<br><span style="opacity:0.7;">Patitas Conectadas — Proyecto Integrador UCN 2026</span></footer>
  <script src="js/comun.js"></script>
  <script src="js/api.js"></script>
  <script src="js/paginas/registro.js"></script>
</body>
</html>
