<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crear cuenta — Patitas Conectadas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container narrow">
    <div class="card">
      <div class="logo-block">
        <div class="paw">🐾</div>
        <h1>Crear cuenta</h1>
        <p class="subtitle">Únete y empieza a buscar a tu mascota ideal</p>
      </div>
      <div id="alertBox"></div>
      <form id="regForm">
        <label>Nombre completo</label>
        <input type="text" id="name" required placeholder="Tu nombre">
        <label>Correo electrónico</label>
        <input type="email" id="email" required placeholder="tu@correo.com">
        <label>Contraseña</label>
        <input type="password" id="password" required placeholder="Mínimo 8 caracteres" minlength="8">
        <label>Confirmar contraseña</label>
        <input type="password" id="password2" required minlength="8">
        <button type="submit" class="full">Crear cuenta</button>
      </form>
      <p class="link-line">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </div>
    <footer class="site-footer-mini">📍 Managua, Nicaragua &nbsp;·&nbsp; 📞 +505 8888-0000 &nbsp;·&nbsp; ✉ contacto@patitasconectadas.com<br><span style="opacity:0.7;">Patitas Conectadas — Proyecto Integrador UCN 2026</span></footer>
  <script src="js/comun.js"></script>
  <script src="js/api.js"></script>
  <script src="js/paginas/registro.js"></script>
</body>
</html>
