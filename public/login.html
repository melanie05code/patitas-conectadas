<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar sesión — Patitas Conectadas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container narrow">
    <div class="card">
      <div class="logo-block">
        <div class="paw">🐾</div>
        <h1>Patitas Conectadas</h1>
        <p class="subtitle">Encuentra a tu nuevo mejor amigo</p>
      </div>
      <div id="alertBox"></div>
      <form id="loginForm">
        <label>Correo electrónico</label>
        <input type="email" id="email" required placeholder="tu@correo.com">
        <label>Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
        <button type="submit" class="full">Ingresar</button>
      </form>
      <p class="link-line">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
      <p class="link-line" style="color:#999; font-size:0.78rem; margin-top:14px;">
        Demo admin: admin@patitas.com / admin123<br>
        Demo adoptante: juan@correo.com / 123456
      </p>
    </div>
  </div>
    <footer class="site-footer-mini">📍 Managua, Nicaragua &nbsp;·&nbsp; 📞 +505 8888-0000 &nbsp;·&nbsp; ✉ contacto@patitasconectadas.com<br><span style="opacity:0.7;">Patitas Conectadas — Proyecto Integrador UCN 2026</span></footer>
  <script src="js/app.js"></script>
  <script>
    if (!redirectIfLoggedIn()) renderTopbar();
    document.getElementById("loginForm").addEventListener("submit", function(e){
      e.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const user = db.getUsers().find(u => u.email.toLowerCase() === email && u.password === password);
      const box = document.getElementById("alertBox");
      if (!user) {
        box.innerHTML = '<div class="alert error">Correo o contraseña incorrectos.</div>';
        return;
      }
      session.set(user);
      window.location.href = user.role === "admin" ? "admin.html" : "catalogo.html";
    });
  </script>
</body>
</html>
