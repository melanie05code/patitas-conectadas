<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Seguimiento — Patitas Conectadas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container narrow">
    <div class="card" id="content"></div>
  </div>
    <footer class="site-footer-mini">📍 Managua, Nicaragua &nbsp;·&nbsp; 📞 +505 8888-0000 &nbsp;·&nbsp; ✉ contacto@patitasconectadas.com<br><span style="opacity:0.7;">Patitas Conectadas — Proyecto Integrador UCN 2026</span></footer>
  <script src="js/app.js"></script>
  <script>
    requireAuth();
    renderTopbar("solicitudes");

    const params = new URLSearchParams(window.location.search);
    const reqId = parseInt(params.get("id"));
    const request = db.getRequests().find(r => r.id === reqId);
    const pet = request ? db.getPets().find(p => p.id === request.petId) : null;
    const content = document.getElementById("content");

    if (!request) {
      content.innerHTML = '<div class="empty-state">Solicitud no encontrada.</div>';
    } else {
      const steps = ["Solicitada", "En revisión", "Aprobada / Rechazada"];
      let stepStates;
      if (request.status === "En revisión") stepStates = ["done", "current", "pending"];
      else stepStates = ["done", "done", "current"]; // Aprobada o Rechazada

      const finalLabel = request.status === "Rechazada" ? "Rechazada" : request.status === "Aprobada" ? "Aprobada" : "Aprobada / Rechazada";
      const labels = ["Solicitada", "En revisión", finalLabel];

      content.innerHTML = `
        <div style="background:var(--orange-light); padding:14px 16px; border-radius:8px; margin-bottom:18px;">
          <div style="font-size:0.85rem; color:var(--orange-text);">Solicitud #${String(request.id).slice(-3)}</div>
          <div style="font-weight:bold; font-size:1.1rem; color:var(--orange-text);">${escaparHtml(pet ? pet.name : "Mascota")}</div>
        </div>
        <div class="timeline">
          ${labels.map((label, i) => {
            const state = stepStates[i];
            const icon = state === "done" ? "✔" : state === "current" ? "●" : "○";
            return `<div class="step ${state}"><div class="dot">${icon}</div><div style="font-weight:bold;">${label}</div></div>`;
          }).join("")}
        </div>
        <div class="card" style="background:var(--gray-light); box-shadow:none; margin-top:16px;">
          <div style="font-size:0.85rem; font-weight:bold; color:#555;">Fecha de la solicitud</div>
          <div>${escaparHtml(request.date)}</div>
        </div>
        <a class="link-line" href="mis-solicitudes.html" style="display:block; margin-top:14px;">← Volver a mis solicitudes</a>
      `;
    }
  </script>
</body>
</html>
