<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitar adopción — Patitas Conectadas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container narrow">
    <div class="card">
      <h1>Solicitar Adopción</h1>
      <div id="petBanner"></div>
      <div id="alertBox"></div>
      <form id="reqForm">
        <label>Teléfono de contacto</label>
        <input type="tel" id="phone" required placeholder="8888-1234" pattern="[0-9]{4}-[0-9]{4}" title="Formato: 8888-1234">
        <small id="phoneHint" style="display:block; color:var(--gray); font-size:0.78rem; margin-top:4px;">Formato: 8888-1234</small>
        <label>Dirección</label>
        <input type="text" id="address" required placeholder="Tu dirección">
        <label>¿Por qué quieres adoptar a esta mascota?</label>
        <textarea id="reason" required placeholder="Cuéntanos un poco..."></textarea>
        <button type="submit" class="full">Enviar solicitud</button>
      </form>
      <p class="link-line" style="color:#999; font-size:0.8rem; margin-top:14px;">Un miembro del refugio revisará tu solicitud pronto</p>
    </div>
  </div>
    <footer class="site-footer-mini">📍 Managua, Nicaragua &nbsp;·&nbsp; 📞 +505 8888-0000 &nbsp;·&nbsp; ✉ contacto@patitasconectadas.com<br><span style="opacity:0.7;">Patitas Conectadas — Proyecto Integrador UCN 2026</span></footer>
  <script src="js/comun.js"></script>
  <script src="js/api.js"></script>
  <script src="js/paginas/solicitar.js"></script>
</body>
</html>
